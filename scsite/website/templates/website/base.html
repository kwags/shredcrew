{% load static %}
{% load blog_tags %}
{% load events_tags %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>
    <meta name="viewport" content="width=device-width">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500;1,600;1,700;1,800&family=Saira+Extra+Condensed:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link href="{% static "css/styles.css" %}" rel="stylesheet">
    <link href="{% static "css/swiper-bundle.css" %}" rel="stylesheet">
    <link href="{% static "css/eventslider.css" %}" rel="stylesheet">

</head>

<body>

    {% include "website/navigation.html" %}
    <main>
      <div id="content">

        {% block content %}
        {% endblock %}

        </div>

        {% include "website/newsletter.html" %}

    </main>


    <footer>
        {% include "website/footer.html" %}
    </footer>

        <!-- Scripts -->
        <script src="{% static 'scripts/swiper-bundle.js' %}"></script>
        <script src="{% static 'scripts/script.js' %}"></script>

</body>

</html>
